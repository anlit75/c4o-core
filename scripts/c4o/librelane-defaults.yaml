# What c4o-core sets for LibreLane when config.yaml does not. `make gds` writes
# these keys, and then the keys of config.yaml over them, to
# build/librelane-config.yaml, and that file is what LibreLane reads. A key of
# config.yaml replaces the same key here; LibreLane's lists are replaced whole,
# not added to, so a list in config.yaml has to repeat what it wants to keep.
#
# Each key is here because of the tools of the LibreLane image `make gds` runs,
# not because of any one design. Remove a key when the image no longer needs it.

# The blackbox stubs LibreLane generates for the PDK cells carry no timescale,
# so TIMESCALEMOD fires once per cell: hundreds of warnings, none from the
# design. UNDRIVEN and UNUSEDSIGNAL are in LibreLane's default list for the
# same reason, and are repeated because this key replaces the default.
LINTER_DISABLE_WARNINGS_BLACKBOX: [UNDRIVEN, UNUSEDSIGNAL, TIMESCALEMOD]

# The physical flow may not use the weakest buffers. When OpenROAD buffers a
# port or splits a net with too many loads, it takes the weakest buffer it
# finds and does not resize it. In sky130_fd_sc_hd that is a delay cell
# (clkdlybuf4s25_1 or dlygate4sd*), because the PDK gives those the same
# footprint as buf_1, or buf_1 itself. The repair step checks the slew against
# the wire load it estimates after placement. After routing the wire load is
# about twice that, so in the ss corners the slew goes past the 0.75 ns limit.
# Without these cells the weakest buffer is buf_2.
#
# Measured with LibreLane 3.0.14: the c4o-pyuvm design went from 297 max slew
# violations to 9, and the 16-bit blinky from 11 to 0. Setup and hold still
# pass. Hold repair then uses plain buffers, so it adds more of them.
# The patterns are sky130_fd_sc_hd's. LibreLane takes them as wildcards over
# the cells of the library in use, so another library matches none and nothing
# is excluded.
# Remove this key when OpenROAD closes issue 10622:
# https://github.com/The-OpenROAD-Project/OpenROAD/issues/10622
EXTRA_EXCLUDED_CELLS:
  - sky130_fd_sc_hd__clkdlybuf4s*
  - sky130_fd_sc_hd__dlygate4sd*
  - sky130_fd_sc_hd__buf_1
