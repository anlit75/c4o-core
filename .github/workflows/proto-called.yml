name: prototype called workflow

# Prototype. Called from another repository to see how its jobs are named on a
# pull request and how a skipped one reports.
on:
  workflow_call:

jobs:
  inner:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event: ${{ github.event_name }}  repository: ${{ github.repository }}"
          echo "this workflow file lives in: ${{ job.workflow_repository }} at ${{ job.workflow_sha }}"
  inner-skipped:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo never
