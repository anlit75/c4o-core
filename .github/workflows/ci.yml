name: c4o-core ci

on:
  # Branches, not tags-ignore. A push trigger that filters only tags does not
  # run for branches at all, so for a while nothing here ran when a pull
  # request was merged: main went untested, and the image publish.yml builds
  # from the tag had only ever been tested as a pull request. Naming the
  # branch also keeps tag pushes out, which is what tags-ignore was for.
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # A release-please pull request changes three files -- the changelog, the
  # manifest and version.txt -- and none of them is read by scripts/ or tests/,
  # so building and testing the image for it tests main again. The commit it
  # releases was tested when it reached main, by the push trigger above.
  #
  # Decided in a job, not with paths-ignore on pull_request: a required check
  # that never runs stays "Expected" and the pull request cannot be merged; a
  # job skipped by `if:` reports as skipped, which a required check accepts.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Does this change anything the image is built from?
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          echo "$files"
          other=$(grep -vxE 'CHANGELOG\.md|\.release-please-manifest\.json|version\.txt' <<<"$files" || true)
          if [ -n "$files" ] && [ -z "$other" ]; then
            echo "::notice::Release files only: the image is not rebuilt for this pull request."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-test-image:
    needs: changes
    # Runs unless the job above said no. If that job fails, its output is
    # empty and this still runs: a broken decision must not look like a pass.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t c4o-core:test .

      - name: Run Python Unit Tests
        run: docker run --rm --entrypoint python3 c4o-core:test /opt/c4o-core/tests/test_entrypoint.py

      # actions/ only ever runs inside somebody else's workflow. Here its
      # scripts are run against the inputs they exist to refuse.
      - name: The action scripts refuse what they should
        run: bash tests/test_actions.sh

      # rules.mk is included by Makefiles in other repositories, out of this
      # image. Here a Makefile like theirs is run against the image just built.
      - name: The Makefile rules work from the image, and fail cleanly without it
        run: bash tests/test_rules.sh

      # Explicit Files Tests
      - name: Run Lint check (CLI)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test lint --files tests/smoke/counter.v

      - name: Run Synthesis check (CLI)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test synth --files tests/smoke/counter.v
          ls -l build/synthesis.json

      # The only place a real yosys runs this: no yosys outside the image, so
      # the flag combination `show` needs (-format svg -viewer none -prefix)
      # is checked here rather than asserted from its documentation.
      - name: Run Schematic check (CLI)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test schematic --files tests/smoke/counter.v
          ls -l build/schematic.svg
          [ -s build/schematic.svg ] || { echo "schematic.svg is empty"; exit 1; }
          # An SVG, not a dot file yosys failed to render, and it should carry
          # the design's own names rather than technology cells.
          head -c 200 build/schematic.svg
          grep -qF "<svg" build/schematic.svg || { echo "not an SVG"; exit 1; }
          grep -qF "counter" build/schematic.svg || { echo "the design's name is not in the drawing"; exit 1; }
          # The picture is all it writes: no block diagrams, no netlist JSON.
          [ ! -e build/blocks ] || { echo "schematic wrote build/blocks"; exit 1; }
          [ ! -e build/schematic.json ] || { echo "schematic wrote build/schematic.json"; exit 1; }

      # The same command on a design with a submodule, which is every real one.
      # `show` draws what is selected and yosys refuses svg for more than one
      # module, so this used to fail:
      #
      #   ERROR: For formats different than 'ps' or 'dot' only one module must
      #          be selected.
      #
      # counter.v alone has no submodule, so the step above never asked the
      # question. counter_wrap.v is the smallest thing that does.
      - name: Run Schematic check on a design with a submodule
        run: |
          cat > config.yaml <<'EOF'
          DESIGN_NAME: counter_wrap
          VERILOG_FILES:
            - dir::tests/smoke/counter_wrap.v
            - dir::tests/smoke/counter.v
          EOF
          # Deleted from inside the image, not from here: the step above wrote
          # build/ as root, and the runner user cannot remove what root left
          # there. The deletion is load-bearing rather than tidy -- without it a
          # failing `schematic` leaves the previous step's SVG in place and the
          # greps below pass on the wrong file.
          docker run --rm -v ${{ github.workspace }}:/workspace \
            --entrypoint rm c4o-core:test -f build/schematic.svg
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test schematic
          [ -s build/schematic.svg ] || { echo "schematic.svg is empty or absent"; exit 1; }
          grep -qF "<svg" build/schematic.svg || { echo "not an SVG"; exit 1; }
          # The drawing has to be of the top the config named, not of whatever
          # module yosys happened to have selected.
          grep -qF "counter_wrap" build/schematic.svg || { echo "the top module is not in the drawing"; exit 1; }
          # Still the picture alone for a design with submodules.
          [ ! -e build/blocks ] || { echo "schematic wrote build/blocks"; exit 1; }
          rm -f config.yaml

      - name: Run Simulation check (CLI)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test sim --files tests/smoke/tb_counter.v tests/smoke/counter.v

      # Config Based Tests
      - name: Create Config for Synthesis
        run: |
          echo '{"DESIGN_NAME": "counter", "VERILOG_FILES": ["tests/smoke/counter.v"], "PDK": "sky130A", "STD_CELL_LIBRARY": "sky130_fd_sc_hd", "DIE_AREA": "0 0 100 100", "FP_CORE_UTIL": 40, "FP_SIZING": "absolute", "CLOCK_PORT": "clk", "CLOCK_PERIOD": 10.0}' > config.json

      - name: Run Lint check (Config)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test lint

      # LINTER_DISABLE_WARNINGS, against the real verilator rather than a mock.
      # lint runs with LibreLane's flags, so a warning is reported and does not
      # fail the run; a latch does. Both halves of the waiver matter: a waiver
      # that silenced nothing would leave WIDTHEXPAND in the second output, and
      # a lint that reported nothing would leave it out of the first. The RTL
      # below is the shape generated code arrives in: sv2v writes `1'sb0` into
      # wider assignments, which is what WIDTHEXPAND is complaining about, and
      # the design synthesises perfectly well.
      - name: A warning the config waives stops showing in lint
        run: |
          cat > widthy.v <<'EOF'
          module widthy (
              input wire clk,
              output reg [31:0] out
          );
              always @(posedge clk) out <= 1'sb0;
          endmodule
          EOF
          cat > config.yaml <<'EOF'
          DESIGN_NAME: widthy
          VERILOG_FILES:
            - dir::widthy.v
          EOF

          out=$(docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test lint 2>&1)
          echo "$out"
          echo "$out" | grep -qF "WIDTHEXPAND" || { echo "lint did not report the un-waived warning"; exit 1; }

          echo 'LINTER_DISABLE_WARNINGS: [WIDTHEXPAND]' >> config.yaml
          out=$(docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test lint 2>&1)
          echo "$out"
          if echo "$out" | grep -qF "%Warning-WIDTHEXPAND"; then
            echo "the waived warning is still reported"; exit 1
          fi
          rm widthy.v

      # A latch is an error in LibreLane's lint step, so it fails lint here too.
      - name: A latch fails lint
        run: |
          cat > latchy.v <<'EOF'
          module latchy (
              input wire en,
              input wire d,
              output reg q
          );
              always @(*) if (en) q = d;
          endmodule
          EOF
          cat > config.yaml <<'EOF'
          DESIGN_NAME: latchy
          VERILOG_FILES:
            - dir::latchy.v
          EOF
          if out=$(docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test lint 2>&1); then
            echo "$out"; echo "expected lint to refuse the latch, but it passed"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -qF "LATCH" || { echo "refused for the wrong reason"; exit 1; }
          rm latchy.v

      # A single code without its brackets is iterable, and would otherwise be
      # spelled out one letter at a time. The refusal has to name the key, or
      # there is nothing in the output pointing at the line to fix.
      - name: A warning code written without its brackets is refused by name
        run: |
          cat > config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::tests/smoke/counter.v
          LINTER_DISABLE_WARNINGS: WIDTHEXPAND
          EOF
          if out=$(docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test lint 2>&1); then
            echo "expected lint to refuse a bare string, but it passed"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -qF "LINTER_DISABLE_WARNINGS" || { echo "the refusal did not name the key"; exit 1; }

      # config.yaml wins over config.json, so the two steps above shadowed the
      # one the rest of this job was written against. Dropping it hands the
      # later steps back their config.json untouched.
      - name: Stop shadowing the config.json the later steps read
        run: rm -f config.yaml

      - name: Run Synthesis check (Config)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test synth
          ls -l build/synthesis.json

      # `rtl` is the config, an Icarus compile, Verilator lint and Yosys, one
      # after the other. Its compile is the one that wrote build/rtl.vvp.
      - name: Run RTL check (Config)
        run: |
          rm -f build/rtl.vvp build/synthesis.json
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test rtl
          ls -l build/rtl.vvp build/synthesis.json

      # No test is configured in this config.json, so a check of every scope
      # stops at the tests, and a check of the RTL alone does not.
      - name: A check without a scope asks for a test
        run: |
          out=$(! docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test check)
          echo "$out"
          echo "$out" | grep -qF "No tests to run" || { echo "check did not ask for a test"; exit 1; }
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test check --for rtl

      - name: Run pre-flight check (Config)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test check --for gds

      # The checks that make 'check' worth running before a three-minute
      # LibreLane run rather than after it. Each is the mistake it names.
      - name: A DESIGN_NAME that names no module fails the pre-flight check
        run: |
          echo '{"DESIGN_NAME": "my_cpu", "VERILOG_FILES": ["tests/smoke/counter.v"], "PDK": "sky130A", "STD_CELL_LIBRARY": "sky130_fd_sc_hd", "DIE_AREA": "0 0 100 100", "FP_CORE_UTIL": 40, "FP_SIZING": "absolute", "CLOCK_PORT": "clk", "CLOCK_PERIOD": 10.0}' > config.json
          ! docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test check --for gds

      - name: A DIE_AREA with no area fails the pre-flight check
        run: |
          echo '{"DESIGN_NAME": "counter", "VERILOG_FILES": ["tests/smoke/counter.v"], "PDK": "sky130A", "STD_CELL_LIBRARY": "sky130_fd_sc_hd", "DIE_AREA": "0 0 100 0", "FP_CORE_UTIL": 40, "FP_SIZING": "absolute", "CLOCK_PORT": "clk", "CLOCK_PERIOD": 10.0}' > config.json
          ! docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test check --for gds

      # The sizing swap, both halves. Relative sizing is what a newcomer wants
      # -- the die resizes itself around whatever design they put in -- and
      # `check` used to refuse it for a DIE_AREA LibreLane would never read.
      - name: Relative sizing needs FP_CORE_UTIL, not DIE_AREA
        run: |
          echo '{"DESIGN_NAME": "counter", "VERILOG_FILES": ["tests/smoke/counter.v"], "PDK": "sky130A", "STD_CELL_LIBRARY": "sky130_fd_sc_hd", "FP_CORE_UTIL": 40, "FP_SIZING": "relative", "CLOCK_PORT": "clk", "CLOCK_PERIOD": 10.0}' > config.json
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test check --for gds

          echo '{"DESIGN_NAME": "counter", "VERILOG_FILES": ["tests/smoke/counter.v"], "PDK": "sky130A", "STD_CELL_LIBRARY": "sky130_fd_sc_hd", "FP_SIZING": "relative", "CLOCK_PORT": "clk", "CLOCK_PERIOD": 10.0}' > config.json
          out=$(! docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test check --for gds)
          echo "$out"
          echo "$out" | grep -qF "FP_CORE_UTIL" || { echo "the refusal did not name the key that is missing"; exit 1; }

      # A warning, not an error -- proving a name is a port needs a real
      # parser. So assert both halves: it says something, and it still passes.
      - name: A CLOCK_PORT absent from the RTL warns but still passes
        run: |
          echo '{"DESIGN_NAME": "counter", "VERILOG_FILES": ["tests/smoke/counter.v"], "PDK": "sky130A", "STD_CELL_LIBRARY": "sky130_fd_sc_hd", "DIE_AREA": "0 0 100 100", "FP_CORE_UTIL": 40, "FP_SIZING": "absolute", "CLOCK_PORT": "wall_clock", "CLOCK_PERIOD": 10.0}' > config.json
          out=$(docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test check --for gds)
          echo "$out"
          echo "$out" | grep -qF "wall_clock" || { echo "no warning named the port"; exit 1; }
          echo "$out" | grep -qF "verified" || { echo "a warning must not fail the check"; exit 1; }

      - name: Restore the config the later steps expect
        run: |
          echo '{"DESIGN_NAME": "counter", "VERILOG_FILES": ["tests/smoke/counter.v"], "PDK": "sky130A", "STD_CELL_LIBRARY": "sky130_fd_sc_hd", "DIE_AREA": "0 0 100 100", "FP_CORE_UTIL": 40, "FP_SIZING": "absolute", "CLOCK_PORT": "clk", "CLOCK_PERIOD": 10.0}' > config.json

      # `check` was called `gds` until 2.26. The name is gone, so a caller
      # that still runs it learns that, and the same check is `check --for gds`.
      - name: The gds alias is gone, and check --for gds is what replaced it
        run: |
          if docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test gds >/dev/null 2>&1; then
            echo "gds still runs, but the alias was removed"; exit 1
          fi
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test check --for gds

      - name: Verify PDK Command Interface
        run: |
          docker run --rm c4o-core:test pdk --help

      # The PDK version is pinned in cmd_pdk. Volare's releases did not all move
      # to Ciel's index, so check the pin still resolves rather than finding out
      # during a real `pdk` run.
      - name: Verify the pinned PDK version is published
        run: |
          docker run --rm --entrypoint ciel c4o-core:test ls-remote --pdk sky130 \
            | grep -q bdc9412b3e468c102d01b7cf6337be06ec6e9c9a

      - name: Update Config for Simulation
        run: |
          echo '{"DESIGN_NAME": "counter", "VERILOG_FILES": ["tests/smoke/counter.v"], "TEST_FILES": ["tests/smoke/tb_counter.v"], "PDK": "sky130A", "STD_CELL_LIBRARY": "sky130_fd_sc_hd", "DIE_AREA": "0 0 100 100", "FP_CORE_UTIL": 40, "FP_SIZING": "absolute", "CLOCK_PORT": "clk", "CLOCK_PERIOD": 10.0}' > config.json

      - name: Run Simulation check (Config)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test sim

      # Same design, written the way LibreLane expects: YAML, 'dir::' paths, and
      # the key LibreLane does not own behind a '//' prefix.
      - name: Create LibreLane-dialect config.yaml
        run: |
          rm -f config.json
          cat > config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::tests/smoke/counter.v
          "//TEST_FILES":
            - dir::tests/smoke/tb_counter.v
          PDK: sky130A
          STD_CELL_LIBRARY: sky130_fd_sc_hd
          DIE_AREA: [0, 0, 100, 100]
          FP_CORE_UTIL: 40
          FP_SIZING: absolute
          CLOCK_PORT: clk
          CLOCK_PERIOD: 10.0
          EOF

      - name: Run all checks (YAML config)
        run: |
          for cmd in lint synth sim "check --for gds"; do
            docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test $cmd
          done

      # The failures below are the whole point of the command, so assert they
      # happen. Each of these used to exit 0 while verifying nothing.
      - name: A testbench pattern that matches nothing fails sim
        run: |
          sed 's|tb_counter.v|*.sv|' config.yaml > /tmp/broken.yaml
          cp /tmp/broken.yaml config.yaml
          ! docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test sim

      - name: A second testbench without SIM_TOP fails sim
        run: |
          printf 'module tb_other; initial $finish; endmodule\n' > tests/smoke/tb_other.v
          cat > config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::tests/smoke/counter.v
          "//TEST_FILES":
            - dir::tests/smoke/tb_counter.v
            - dir::tests/smoke/tb_other.v
          EOF
          ! docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test sim

      - name: SIM_TOP names the root and sim runs
        run: |
          echo '"//SIM_TOP": tb_counter' >> config.yaml
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test sim

      # cocotb drives the same design from Python instead of a Verilog
      # testbench. The negative case matters more than the positive one: vvp
      # exits 0 even when every cocotb test failed, so without reading the
      # results file this would be green no matter what the tests did.
      # gatesim needs a netlist and a 3GB PDK, neither of which this job has,
      # so what is checkable here is the interface: that it refuses clearly
      # rather than running something meaningless. ChipForAll exercises the
      # real thing, where a LibreLane run and the PDK both exist.
      # Both of these assert the message, not just a non-zero exit. They used
      # to assert only the exit code, and the second one was silently testing
      # the same path as the first: its `mkdir -p build/runs/...` failed with
      # "Permission denied", because build/ is created inside the container as
      # root by the earlier steps, so the stub netlist never existed and
      # gatesim refused for having no netlist rather than no cell models.
      # Hence runs/ rather than build/runs/ -- gatesim searches both, and this
      # one the runner can actually create.
      # A gate test key is set, so the refusal can only be about the netlist:
      # with no key at all, gatesim stops earlier and names the keys instead.
      - name: gatesim refuses when there is no netlist
        run: |
          rm -rf runs
          mkdir -p gate && printf 'module tb_gl; endmodule\n' > gate/tb_gl.v
          cat > config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::tests/smoke/counter.v
          "//GATE_TESTS":
            - dir::gate/*.v
          EOF
          if out=$(docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test gatesim 2>&1); then
            echo "expected gatesim to refuse, but it succeeded"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -qF "No netlist found" || { echo "refused for the wrong reason"; exit 1; }
          rm -rf gate

      - name: gatesim refuses when the cell models are absent
        run: |
          mkdir -p runs/r/final/nl && touch runs/r/final/nl/counter.nl.v
          mkdir -p gate && printf 'module tb_gl; endmodule\n' > gate/tb_gl.v
          cat > config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::tests/smoke/counter.v
          PDK: sky130A
          STD_CELL_LIBRARY: sky130_fd_sc_hd
          "//GATE_TESTS":
            - dir::gate/*.v
          EOF
          if out=$(docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test gatesim 2>&1); then
            echo "expected gatesim to refuse, but it succeeded"; exit 1
          fi
          echo "$out"
          # The point of this step: it must get past the netlist check first.
          echo "$out" | grep -qF "Cell models not found" || { echo "refused for the wrong reason"; exit 1; }
          ! echo "$out" | grep -qF "No netlist found"
          rm -rf gate runs

      # cocotb dlopens libpython at runtime. When it is absent the simulator
      # runs nothing and still exits 0, so assert it resolves here where the
      # error names the cause.
      - name: The image can find the libpython cocotb dlopens
        run: |
          path=$(docker run --rm --entrypoint cocotb-config c4o-core:test --libpython)
          echo "libpython: $path"
          docker run --rm --entrypoint test c4o-core:test -f "$path"

      - name: Run cocotb tests (Python testbench)
        run: |
          cat > config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::tests/smoke/counter.v
          "//COCOTB_TESTS":
            - dir::tests/smoke/test_counter_cocotb.py
          EOF
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test cocotb

      # The unit tests feed `site` a results file shaped by hand. This feeds it
      # the one the image's own cocotb just wrote, so a cocotb that renames
      # sim_time_ns or stops recording the seed shows up here rather than as a
      # page of zeroes. The previous step's results are all passes.
      - name: The page site writes shows the cocotb run it read
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test site
          page=build/site/index.html
          grep -qF "<h1>counter</h1>" "$page" || { echo "the design's name is not the heading"; exit 1; }
          grep -qE "cocotb, RTL: ([0-9]+)/\1 passed" "$page" || { echo "the page does not report every test passing"; exit 1; }
          grep -qE "Seed <code>[0-9]+</code>" "$page" || { echo "the page lost the seed that reruns a failure"; exit 1; }
          grep -qE 'class="num">[1-9][0-9.]*<' "$page" || { echo "every simulated time is zero -- sim_time_ns was not read"; exit 1; }
          # Only the sections that have something behind them, and none of the
          # ones the page dropped.
          ids=$(grep -o '<section id="[a-z0-9-]*"' "$page" | sed 's/.*id="//; s/"//' | tr '\n' ' ')
          [ "$ids" = "tests-0 " ] || { echo "sections after cocotb alone: '$ids'"; exit 1; }
          for gone in Waveform "Block diagram" Schematic "Worst setup path" WAVE_SIGNALS; do
            ! grep -qF "$gone" "$page" || { echo "the page still has '$gone'"; exit 1; }
          done

      # The debug VCD is opt-in: WAVES=1 in the environment, which make
      # passes into the container. Both runs go through the image's own
      # cocotb and icarus. The key a copy made before WAVES still carries is
      # in the config on purpose: it must neither dump nor break the run.
      # The simulation step above wrote build/counter.vcd too, so the file is
      # removed from inside the image first, as the schematic step does.
      - name: cocotb writes a VCD only when WAVES=1
        run: |
          printf '"//WAVE_SIGNALS":\n  - counter.count\n' >> config.yaml
          run() { docker run --rm -v ${{ github.workspace }}:/workspace "$@"; }
          run --entrypoint rm c4o-core:test -f build/counter.vcd
          run c4o-core:test cocotb
          [ ! -e build/counter.vcd ] || { echo "cocotb wrote a VCD without WAVES=1"; exit 1; }
          run -e WAVES=1 c4o-core:test cocotb
          [ -s build/counter.vcd ] || { echo "WAVES=1 wrote no build/counter.vcd"; exit 1; }
          grep -qF '$scope module counter' build/counter.vcd || { echo "the VCD does not hold the design"; exit 1; }
          grep -qE '^#[1-9]' build/counter.vcd || { echo "the VCD holds no signal change"; exit 1; }
          run --entrypoint rm c4o-core:test -f build/counter.vcd
          run -e WAVES=0 c4o-core:test cocotb
          [ ! -e build/counter.vcd ] || { echo "WAVES=0 wrote a VCD"; exit 1; }

      - name: A failing cocotb test fails the command
        run: |
          cat > tests/smoke/test_failing_cocotb.py <<'EOF'
          import cocotb

          @cocotb.test()
          async def always_fails(dut):
              assert False, "deliberate"
          EOF
          cat > config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::tests/smoke/counter.v
          "//COCOTB_TESTS":
            - dir::tests/smoke/test_failing_cocotb.py
          EOF
          ! docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test cocotb
          rm tests/smoke/test_failing_cocotb.py

      # `coverage` runs the cocotb tests a second time, on Verilator. The design
      # here has holes on purpose, so the numbers have a known answer: the else
      # branch is never run and hole_marker never leaves 0. Each fact is read
      # out of the files the command wrote, not out of its exit code.
      - name: coverage measures the cocotb tests and leaves the Icarus verdict alone
        run: |
          mkdir -p cov/tests/smoke
          cp tests/smoke/holes.v tests/smoke/test_holes_cocotb.py cov/tests/smoke/
          cat > cov/config.yaml <<'EOF'
          DESIGN_NAME: holes
          VERILOG_FILES:
            - dir::tests/smoke/holes.v
          "//COCOTB_TESTS":
            - dir::tests/smoke/test_holes_cocotb.py
          EOF
          run() { docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/cov "$@"; }
          run c4o-core:test cocotb
          before=$(sha256sum cov/build/cocotb-results.xml)
          run -e RANDOM_SEED=4242 c4o-core:test coverage
          [ "$before" = "$(sha256sum cov/build/cocotb-results.xml)" ] \
            || { echo "coverage changed build/cocotb-results.xml, which is the Icarus verdict"; exit 1; }
          for f in coverage.dat run-1.dat summary.json results.xml; do
            [ -s "cov/build/coverage/$f" ] || { echo "build/coverage/$f is missing"; exit 1; }
          done
          [ ! -e cov/build/coverage/work ] || { echo "the compiled model was left in build/coverage"; exit 1; }
          python3 - <<'PY'
          import json, re, sys
          d = json.load(open("cov/build/coverage/summary.json"))
          got = {k: (v["hit"], v["total"], v["percent"]) for k, v in d["types"].items()}
          want = {"line": (1, 1, 100.0), "branch": (3, 4, 75.0), "toggle": (5, 6, 83.3)}
          if got != want:
              sys.exit(f"::error::coverage numbers are {got}, expected {want}")
          # The same numbers from the records themselves, counted here.
          count = {}
          for text in open("cov/build/coverage/coverage.dat"):
              m = re.match(r"C '.*page\x02v_(\w+)/[^\x01]*.*' (\d+)$", text.rstrip("\n"))
              if m:
                  hit, total = count.get(m[1], (0, 0))
                  count[m[1]] = (hit + (int(m[2]) >= 1), total + 1)
          if count != {k: v[:2] for k, v in want.items()}:
              sys.exit(f"::error::coverage.dat holds {count}")
          if d["tests"] != {"total": 1, "passed": 1}:
              sys.exit(f"::error::tests are {d['tests']}")
          if d["files"] != ["tests/smoke/holes.v"]:
              sys.exit(f"::error::files are {d['files']}")
          if [m["name"] for m in d["modules"]] != ["holes"]:
              sys.exit(f"::error::modules are {d['modules']}")
          missed = [(m["line"], m["text"]) for m in d["uncovered"]]
          # The else branch and its statement. Line 11, hole_marker's declaration,
          # failed toggle only and is not code that did not run.
          if missed != [(21, "end else begin"), (22, "hole_marker <= 1'b1;")]:
              sys.exit(f"::error::the lines nothing ran are {missed}")
          if d["seed"] != "4242":
              sys.exit(f"::error::the coverage run's seed is {d['seed']}, expected the RANDOM_SEED it was given")
          print("coverage:", got, "missed:", missed)
          PY

      - name: The page shows the coverage that was measured
        run: |
          run() { docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/cov "$@"; }
          run c4o-core:test site
          page=cov/build/site/index.html
          ids=$(grep -o '<section id="[a-z0-9-]*"' "$page" | sed 's/.*id="//; s/"//' | tr '\n' ' ')
          [ "$ids" = "summary tests-0 coverage " ] || { echo "sections are '$ids'"; exit 1; }
          grep -qF "<h2>Coverage</h2>" "$page" || { echo "no Coverage heading"; exit 1; }
          for row in '<td>Block</td><td class="num">1 / 1</td><td class="num">100.0%</td>' \
                     '<td>Branch</td><td class="num">3 / 4</td><td class="num">75.0%</td>' \
                     '<td>Toggle</td><td class="num">5 / 6</td><td class="num">83.3%</td>'; do
            grep -qF "$row" "$page" || { echo "the page has no row $row"; exit 1; }
          done
          # The Summary card is three stats and nothing else: no figure across
          # the kinds and no detail under them.
          python3 - "$page" <<'PY'
          import re, sys
          page = open(sys.argv[1]).read()
          card = re.search(r'<div class="kpi coverage"><div class="label">code coverage</div><div class="stats">(.*?</div></div>)</div></div>', page, re.S)
          if not card:
              sys.exit("::error::the Summary has no code coverage card")
          stats = re.findall(r'<div class="stat"><div class="value">([^<]*)</div><div class="detail">([^<]*)</div></div>', card[1])
          want = [("100.0%", "Block"), ("75.0%", "Branch"), ("83.3%", "Toggle")]
          if stats != want or card[1].count('class="stat"') != 3 or "block." in card[0]:
              sys.exit(f"::error::the code coverage card is {stats}, expected {want}: {card[0]}")
          PY
          # The lines are in summary.json, checked above, and not on the page.
          ! grep -qF "sv2v" "$page" || { echo "the page explains sv2v"; exit 1; }
          ! grep -qF "Line/block" "$page" || { echo "the page still says Line/block"; exit 1; }
          ! grep -qF "Lines no test reached" "$page" || { echo "the page lists the lines no test reached"; exit 1; }
          ! grep -qF "hole_marker &lt;=" "$page" || { echo "the page shows source lines"; exit 1; }
          grep -qF "This run used seed <code>4242</code>" "$page" || { echo "the page does not name the coverage run's seed"; exit 1; }
          grep -qF "Not measured: expression and FSM coverage." "$page" || { echo "the page does not say what is not measured"; exit 1; }
          # Without the coverage files the page is the page it was.
          run --entrypoint rm c4o-core:test -rf build/coverage
          run c4o-core:test site
          # Not in the stylesheet, which names the card's class for every page.
          body=$(python3 -c "import re, sys; print(re.sub(r'<style>.*?</style>', '', open(sys.argv[1]).read(), flags=re.S))" "$page")
          ! grep -qiF "coverage" <<<"$body" || { echo "a page with no coverage data still mentions coverage"; exit 1; }

      # The verdict is Icarus's, so a test that fails on Verilator does not make
      # `coverage` fail -- but a design Verilator cannot build does. A cocotb
      # test that fails on both is the case that shows the first half.
      - name: coverage still reports when a test fails, and fails when the design cannot be built
        run: |
          mkdir -p cov2/tests/smoke cov3/tests/smoke
          cp tests/smoke/counter.v cov2/tests/smoke/
          cat > cov2/tests/smoke/test_failing_cocotb.py <<'EOF'
          import cocotb

          @cocotb.test()
          async def always_fails(dut):
              assert False, "deliberate"
          EOF
          cat > cov2/config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::tests/smoke/counter.v
          "//COCOTB_TESTS":
            - dir::tests/smoke/test_failing_cocotb.py
          EOF
          run() { docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/"$1" "${@:2}"; }
          ! run cov2 c4o-core:test cocotb
          run cov2 c4o-core:test coverage
          python3 -c "
          import json, sys
          d = json.load(open('cov2/build/coverage/summary.json'))
          sys.exit(0 if d['tests'] == {'total': 1, 'passed': 0} and d['types']['line']['total'] > 0 else 'tests: %s' % d['tests'])"

          printf 'module broken(input clk;\n' > cov3/tests/smoke/broken.v
          cp cov2/tests/smoke/test_failing_cocotb.py cov3/tests/smoke/
          cat > cov3/config.yaml <<'EOF'
          DESIGN_NAME: broken
          VERILOG_FILES:
            - dir::tests/smoke/broken.v
          "//COCOTB_TESTS":
            - dir::tests/smoke/test_failing_cocotb.py
          EOF
          if out=$(run cov3 c4o-core:test coverage 2>&1); then
            echo "coverage passed on a design that does not build"; exit 1
          fi
          grep -qF "Verilator could not build the design" <<<"$out" \
            || { echo "coverage failed, but not because of the build:"; echo "$out" | tail -20; exit 1; }
          [ ! -e cov3/build/coverage/summary.json ] || { echo "a design that did not build has coverage numbers"; exit 1; }

      # c4o-pyuvm does not build on Verilator without the waivers its config
      # names, and coverage has to read that key as lint does.
      - name: coverage applies LINTER_DISABLE_WARNINGS
        run: |
          mkdir -p cov4/tests/smoke
          cat > cov4/tests/smoke/trunc.v <<'EOF'
          `timescale 1ns/1ps
          module trunc (input clk, output reg [3:0] count, output wire [1:0] low);
              assign low = count;
              always @(posedge clk) count <= count + 1;
          endmodule
          EOF
          cat > cov4/tests/smoke/test_trunc.py <<'EOF'
          import cocotb
          from cocotb.clock import Clock
          from cocotb.triggers import RisingEdge

          @cocotb.test()
          async def ticks(dut):
              cocotb.start_soon(Clock(dut.clk, 10, units="ns").start())
              for _ in range(4):
                  await RisingEdge(dut.clk)
          EOF
          cat > cov4/config.yaml <<'EOF'
          DESIGN_NAME: trunc
          VERILOG_FILES:
            - dir::tests/smoke/trunc.v
          "//COCOTB_TESTS":
            - dir::tests/smoke/test_trunc.py
          EOF
          run() { docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/cov4 c4o-core:test "$@"; }
          ! run coverage
          printf 'LINTER_DISABLE_WARNINGS: [WIDTHTRUNC]\n' >> cov4/config.yaml
          run coverage
          [ -s cov4/build/coverage/summary.json ] || { echo "no summary after the waiver"; exit 1; }

      # `cocotb --netlist` drives what synthesis produced, with the tests
      # unchanged. tests/smoke/test_counter_cocotb.py only ever touches clk,
      # rst and count, which is exactly why it survives the trip -- and is the
      # claim gatesim cannot make, since its testbench is a separate Verilog
      # file written for the netlist.
      #
      # There is no PDK in this job, so the cell models here are yosys's own
      # simulation library and the netlist is one yosys has just produced.
      # That is what a netlist is: cell instances plus a library defining them.
      # It proves the path, not sky130; ChipForAll exercises the real PDK.
      - name: cocotb --netlist runs the same tests against the gates
        run: |
          mkdir -p gl/tests/smoke gl/runs/counter_run/final/nl
          mkdir -p gl/pdks/toypdk/libs.ref/toy_lib/verilog
          cp tests/smoke/counter.v tests/smoke/test_counter_cocotb.py gl/tests/smoke/
          cat > gl/config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::tests/smoke/counter.v
          "//COCOTB_TESTS":
            - dir::tests/smoke/test_counter_cocotb.py
          PDK: toypdk
          STD_CELL_LIBRARY: toy_lib
          EOF
          # The models carry the timescale, the way the sky130 ones do.
          printf '`timescale 1ns/1ps\n' > gl/pdks/toypdk/libs.ref/toy_lib/verilog/primitives.v

          run() { docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/gl "$@"; }

          # -noexpr so the netlist holds cell instances rather than operators.
          run --entrypoint yosys c4o-core:test -p "read_verilog tests/smoke/counter.v; synth -top counter; splitnets; write_verilog -noattr -noexpr runs/counter_run/final/nl/counter.nl.v"
          run --entrypoint cp c4o-core:test /usr/share/yosys/simcells.v pdks/toypdk/libs.ref/toy_lib/verilog/toy_lib.v
          grep -q 'DFF' gl/runs/counter_run/final/nl/counter.nl.v || { echo "yosys produced no flip-flop cells"; exit 1; }

          out=$(run c4o-core:test cocotb --netlist)
          echo "$out"
          # It has to be the netlist that was compiled. Running the RTL instead
          # would pass these tests too, and prove nothing.
          echo "$out" | grep -qF "counter.nl.v" || { echo "the netlist was not compiled"; exit 1; }
          # -e, or grep reads -DFUNCTIONAL as its own --devices option.
          echo "$out" | grep -qF -e "-DFUNCTIONAL" || { echo "the cell-model defines are missing"; exit 1; }
          echo "$out" | grep -q "tests/smoke/counter.v" && { echo "the RTL was compiled as well"; exit 1; }
          test -s gl/build/cocotb-gl-results.xml

          # The RTL run keeps its own verdict file, so both can be read after.
          run c4o-core:test cocotb
          test -s gl/build/cocotb-results.xml

      # `gatesim` with no //GATE_TESTS and with //COCOTB_TESTS is the same run as
      # `cocotb --netlist`. Same toy library and netlist as the step above, which
      # left them in gl/. The verdict file is removed first, so what is read
      # below is what this command wrote. Asserted by content: the same tests as
      # the RTL run, all passing, and not the Verilog gate path.
      - name: gatesim with only COCOTB_TESTS runs the cocotb tests on the gates
        run: |
          run() { docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/gl "$@"; }
          run --entrypoint rm c4o-core:test -f build/cocotb-gl-results.xml
          out=$(run c4o-core:test gatesim)
          echo "$out"
          echo "$out" | grep -qF "counter.nl.v" || { echo "the netlist was not compiled"; exit 1; }
          echo "$out" | grep -qF "build/cocotb-gl.vvp" || { echo "this was not the cocotb gate run"; exit 1; }
          echo "$out" | grep -qF "build/gatesim.vvp" && { echo "the Verilog gate path ran"; exit 1; }
          echo "$out" | grep -qE "TESTS=3 PASS=3 FAIL=0 SKIP=0" || { echo "the gates did not pass the 3 tests"; exit 1; }
          gl=gl/build/cocotb-gl-results.xml
          grep -qF 'name="counts_up_by_one"' "$gl" || { echo "the verdict file lacks the tests"; exit 1; }
          [ "$(grep -c '<testcase' "$gl")" = "$(grep -c '<testcase' gl/build/cocotb-results.xml)" ] \
            || { echo "the gates ran a different number of tests than the RTL"; exit 1; }
          ! grep -qE '<(failure|error)' "$gl" || { echo "a test failed on the gates"; exit 1; }

      # With neither key, and with only the Python tests, in a directory of
      # its own so the config above stays what the next step expects.
      - name: gatesim with neither test key fails and names both
        run: |
          mkdir -p gl2
          cat > gl2/config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::../tests/smoke/counter.v
          PDK: toypdk
          STD_CELL_LIBRARY: toy_lib
          EOF
          if out=$(docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/gl2 c4o-core:test gatesim 2>&1); then
            echo "expected gatesim to refuse, but it succeeded"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -qF "GATE_TESTS" || { echo "the message does not name GATE_TESTS"; exit 1; }
          echo "$out" | grep -qF "COCOTB_TESTS" || { echo "the message does not name COCOTB_TESTS"; exit 1; }

      # What `make sim` runs, one command at a time, because there is no make in
      # the image. The ledger passes these flags to the same commands.
      - name: all runs the Python tests alone, skips the missing kind, fails on neither
        run: |
          run() { docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/gl2 "$@"; }
          run --entrypoint rm c4o-core:test -rf build
          cat > gl2/config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::../tests/smoke/counter.v
          "//COCOTB_TESTS":
            - dir::../tests/smoke/test_counter_cocotb.py
          EOF
          out=$(run c4o-core:test sim --if-configured)
          echo "$out"
          echo "$out" | grep -qF "sim skipped: TEST_FILES is not set" || { echo "sim did not say it skipped"; exit 1; }
          ! test -e gl2/build/sim.vvp || { echo "sim ran"; exit 1; }
          run c4o-core:test cocotb --if-configured
          grep -qF 'name="counts_up_by_one"' gl2/build/cocotb-results.xml || { echo "the Python tests did not run"; exit 1; }
          run c4o-core:test synth

          # Only a Verilog testbench: cocotb is the one skipped.
          cat > gl2/config.yaml <<'EOF'
          DESIGN_NAME: counter
          VERILOG_FILES:
            - dir::../tests/smoke/counter.v
          "//TEST_FILES":
            - dir::../tests/smoke/tb_counter.v
          EOF
          run --entrypoint rm c4o-core:test -rf build
          out=$(run c4o-core:test cocotb --if-configured)
          echo "$out"
          echo "$out" | grep -qF "cocotb skipped: COCOTB_TESTS is not set" || { echo "cocotb did not say it skipped"; exit 1; }
          ! test -e gl2/build/cocotb-results.xml || { echo "cocotb ran"; exit 1; }
          run c4o-core:test sim --if-configured
          test -e gl2/build/sim.vvp || { echo "sim did not run"; exit 1; }

          # Neither: both commands refuse, and say which keys.
          printf 'DESIGN_NAME: counter\nVERILOG_FILES:\n  - dir::../tests/smoke/counter.v\n' > gl2/config.yaml
          for cmd in sim cocotb; do
            if out=$(run c4o-core:test $cmd --if-configured 2>&1); then
              echo "expected $cmd --if-configured to refuse, but it succeeded"; exit 1
            fi
            echo "$out"
            echo "$out" | grep -qF "TEST_FILES" && echo "$out" | grep -qF "COCOTB_TESTS" \
              || { echo "the $cmd message does not name both keys"; exit 1; }
          done
          # Asked for by name, without being configured, they still fail.
          for cmd in sim cocotb; do
            if run c4o-core:test $cmd >/dev/null 2>&1; then
              echo "expected $cmd to fail without its key, but it passed"; exit 1
            fi
          done

      - name: cocotb --netlist refuses rather than falling back to the RTL
        run: |
          # Deleted from inside the image: the run above wrote these as root,
          # and the runner user cannot remove what root left in build/.
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/gl \
            --entrypoint rm c4o-core:test -rf runs
          if out=$(docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/gl \
                     c4o-core:test cocotb --netlist 2>&1); then
            echo "expected a refusal, but it ran something"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -qF "No netlist found" || { echo "refused for the wrong reason"; exit 1; }

      # The generator chain, end to end, in the image that has to run it:
      # one SystemRDL file becomes a register block, that becomes Verilog-2005,
      # and that lints and synthesises. Each link is a tool this image gained
      # for c4o-pyuvm, and a version bump to any of them breaks it here rather
      # than in somebody's design.
      #
      # The middle assertion is the one that explains why sv2v is installed at
      # all: PeakRDL's SystemVerilog is not something yosys will read, and the
      # refusal is asserted by its message so that a yosys which one day grows
      # unpacked-struct support shows up as a changed reason rather than a
      # silent pass.
      - name: SystemRDL becomes a register block that synthesises
        run: |
          mkdir -p rdlchain/tests/smoke rdlchain/rdl
          cp tests/smoke/regs.rdl rdlchain/tests/smoke/
          cat > rdlchain/config.yaml <<'EOF'
          DESIGN_NAME: regs
          VERILOG_FILES:
            - dir::rdl/regs.v
          LINTER_DISABLE_WARNINGS: [WIDTHEXPAND]
          EOF

          run() { docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/rdlchain "$@"; }

          run --entrypoint peakrdl c4o-core:test regblock tests/smoke/regs.rdl -o rdl --cpuif apb3-flat
          test -s rdlchain/rdl/regs.sv
          test -s rdlchain/rdl/regs_pkg.sv

          if out=$(run --entrypoint yosys c4o-core:test -p "read_verilog -sv rdl/regs_pkg.sv rdl/regs.sv" 2>&1); then
            echo "yosys accepted the raw SystemVerilog -- sv2v may no longer be needed, check before removing it"; exit 1
          fi
          echo "$out" | grep -qF "Only PACKED supported" || { echo "yosys refused for some other reason"; exit 1; }

          run --entrypoint sh c4o-core:test -c "sv2v rdl/regs_pkg.sv rdl/regs.sv > rdl/regs.v"
          test -s rdlchain/rdl/regs.v

          # LINTER_DISABLE_WARNINGS is doing real work here: sv2v writes signed
          # one-bit zeroes into wider assignments, and verilator calls that
          # WIDTHEXPAND. Without the waiver this lint is red.
          run c4o-core:test lint
          run c4o-core:test synth
          test -s rdlchain/build/synthesis.json

      # The other half of the same source file. A hand-written RAL that drifts
      # from the RTL is a bug no testbench catches -- both sides agree with each
      # other and neither agrees with the design -- so the point is that these
      # two came out of one .rdl.
      - name: The same SystemRDL generates a pyuvm register model
        run: |
          run() { docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/rdlchain "$@"; }
          run --entrypoint peakrdl c4o-core:test pyuvm tests/smoke/regs.rdl -o rdl/regs_ral.py
          out=$(run --entrypoint python3 c4o-core:test -c "
          import sys; sys.path.insert(0, 'rdl')
          import pyuvm, regs_ral
          block = regs_ral.regs('regs')
          print('pyuvm', pyuvm.__version__, type(block).__name__, sorted(n for n in dir(regs_ral) if n.startswith('regs__')))
          ")
          echo "$out"
          # Importable is not enough: the model has to carry the registers the
          # .rdl declares, or the generator quietly produced an empty block.
          echo "$out" | grep -qF "regs__CTRL" || { echo "the register model is missing CTRL"; exit 1; }
          echo "$out" | grep -qF "regs__STATUS" || { echo "the register model is missing STATUS"; exit 1; }

      # The fixture holds the real metrics of a real blinky run, so this asserts
      # the numbers the report prints, not just that it exits 0.
      - name: Report reads a LibreLane run's metrics
        run: |
          out=$(docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test \
                  report tests/fixtures/metrics.json)
          echo "$out"
          for expected in "100 x 100 um" "29.2%" "243" "+4.69 ns" "0.292 mW"; do
            echo "$out" | grep -qF "$expected" || { echo "missing: $expected"; exit 1; }
          done

      # The fixture above predates the signoff keys, so it also proves the
      # other half: a check the run never reported must not print as a pass.
      - name: Report says nothing about signoff when the run reported none
        run: |
          ! docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test \
              report tests/fixtures/metrics.json | grep -q signoff

      - name: Report names the signoff checks that failed
        run: |
          out=$(docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test \
                  report tests/fixtures/metrics-signoff-dirty.json)
          echo "$out"
          echo "$out" | grep -qF "2 DRC (Magic)" || { echo "missing: 2 DRC (Magic)"; exit 1; }
          echo "$out" | grep -qF "1 LVS" || { echo "missing: 1 LVS"; exit 1; }
          # A zero must not be listed alongside them, and nothing here is clean.
          ! echo "$out" | grep -qF "0 antenna"
          ! echo "$out" | grep -qF "clean"

      - name: Report fails when there is no run to read
        run: |
          ! docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test report

      - name: Upload Docker Build Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-docker-build
          path: build/
          retention-days: 5

  # actions/ only ever runs inside somebody else's workflow, so a wiring
  # mistake in an action.yml -- a wrong path, a renamed output, a step out of
  # order -- is first seen by a caller, after the release that moved v2 has
  # reached all of them. Here the five actions run from this checkout, in the
  # order a caller uses them, and what each leaves behind is asserted.
  #
  # The caller is ChipForAll at main, not a copy of it kept here: it is the
  # real thing, and nothing drifts. The price is that a change over there can
  # turn this job red, which is a caller breaking.
  #
  # setup pulls the c4o-core image by the name the Makefile gives and cannot
  # use one that only exists locally. So the image of this checkout goes to a
  # local registry, and the caller's Makefile and devcontainer.json are pointed
  # at it, along with this checkout's stub.mk.
  actions-end-to-end:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read  # only to ask whether Pages is on
      actions: read  # to list this run's artifacts
    services:
      registry:
        image: registry:2
        ports: ['5000:5000']
    steps:
      # The actions read Makefile, config.yaml, pdks/, build/ and runs/ at the
      # workspace root and have no working-directory input, so the caller goes
      # there and this checkout goes beside it.
      - name: Check out ChipForAll as the caller
        uses: actions/checkout@v5
        with:
          repository: anlit75/ChipForAll
          ref: main

      - name: Check out this commit of c4o-core
        uses: actions/checkout@v5
        with:
          path: c4o-core

      - name: Build this checkout's image and push it to the local registry
        run: |
          docker build -t localhost:5000/c4o-core:test c4o-core
          docker push localhost:5000/c4o-core:test

      # Each edit is asserted, so a sed that matched nothing turns this red
      # instead of leaving the caller on the published image.
      - name: Make ChipForAll a caller of this checkout
        run: |
          local_image=localhost:5000/c4o-core:test
          marker="# --- From here down this file is c4o-core's stub.mk"

          sed -i "s|^C4O_IMAGE := .*|C4O_IMAGE := $local_image|" Makefile
          sed -i -E 's|("image"[[:space:]]*:[[:space:]]*")[^"]*(")|\1'"$local_image"'\2|' .devcontainer/devcontainer.json

          line=$(grep -nF "$marker" Makefile | head -n 1 | cut -d: -f1 || true)
          if [ -z "$line" ]; then
            echo "::error::The Makefile has no line starting '$marker'. The stub cannot be replaced."
            exit 1
          fi
          head -n $((line - 1)) Makefile > Makefile.new
          cat c4o-core/stub.mk >> Makefile.new
          mv Makefile.new Makefile

          count=$(grep -cxF "C4O_IMAGE := $local_image" Makefile || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected one 'C4O_IMAGE := $local_image' line in the Makefile, found $count."
            exit 1
          fi
          line=$(grep -nF "$marker" Makefile | head -n 1 | cut -d: -f1)
          if ! tail -n +"$line" Makefile | diff -u c4o-core/stub.mk -; then
            echo "::error::The Makefile from its marker line on is not c4o-core's stub.mk."
            exit 1
          fi
          if ! grep -qF "\"image\": \"$local_image\"" .devcontainer/devcontainer.json; then
            echo "::error::.devcontainer/devcontainer.json does not name $local_image."
            exit 1
          fi
          grep -n '^C4O_IMAGE :=' Makefile
          grep -n '"image"' .devcontainer/devcontainer.json

      - name: Setup
        id: setup
        uses: ./c4o-core/actions/setup

      - name: Setup reported the image, the PDK version and the cache
        env:
          IMAGE: ${{ steps.setup.outputs.image }}
          PDK_VERSION: ${{ steps.setup.outputs.pdk-version }}
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "image=$IMAGE pdk-version=$PDK_VERSION cache-hit=$CACHE_HIT"
          if [ "$IMAGE" != localhost:5000/c4o-core:test ]; then
            echo "::error::setup's image output is '$IMAGE', expected localhost:5000/c4o-core:test."
            exit 1
          fi
          if ! grep -qE '^[0-9a-f]{40}$' <<<"$PDK_VERSION"; then
            echo "::error::setup's pdk-version output is '$PDK_VERSION', expected 40 hex digits."
            exit 1
          fi
          # actions/cache leaves cache-hit empty when no key matched at all.
          if [ "$CACHE_HIT" != true ] && [ "$CACHE_HIT" != false ] && [ -n "$CACHE_HIT" ]; then
            echo "::error::setup's cache-hit output is '$CACHE_HIT', expected true, false or empty."
            exit 1
          fi

      - name: Checks
        uses: ./c4o-core/actions/checks

      # Read as XML: a test that failed is a <failure>, and the runner exits 0
      # either way.
      - name: The cocotb results hold passing tests
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = "build/cocotb-results.xml"
          try:
              root = ET.parse(path).getroot()
          except (OSError, ET.ParseError) as e:
              print(f"::error::{path} cannot be read: {e}")
              sys.exit(1)
          cases = list(root.iter("testcase"))
          bad = list(root.iter("failure")) + list(root.iter("error"))
          print(f"{len(cases)} testcase(s), {len(bad)} failure(s) or error(s)")
          if not cases:
              print(f"::error::{path} has no testcase.")
              sys.exit(1)
          if bad:
              print(f"::error::{path} has failures or errors.")
              sys.exit(1)
          PY

      - name: Physical design
        uses: ./c4o-core/actions/gds

      # Coverage is asked for by name, as a caller's verify.yml does: this image
      # has the target, so the page has to have the section.
      - name: Report
        id: report
        uses: ./c4o-core/actions/report
        with:
          sections: |
            Coverage

      # Written by c4o-core's own `make site`, so the commit is this checkout's:
      # the workflow runs in c4o-core, and GITHUB_SHA is its commit.
      - name: The results page links the commit it was built from
        env:
          PUBLISH_PAGES: ${{ steps.report.outputs.publish-pages }}
        run: |
          echo "publish-pages='$PUBLISH_PAGES'"
          page=build/site/index.html
          if [ ! -s "$page" ]; then
            echo "::error::$page is missing or empty."
            exit 1
          fi
          if ! grep -qF "/commit/$GITHUB_SHA" "$page"; then
            echo "::error::$page does not link /commit/$GITHUB_SHA."
            exit 1
          fi
          # The summary first, then the verdicts, area and instances, power,
          # signoff, and how it was built last. The tests sections between the
          # summary and coverage are one or two, so they are left out of the list.
          ids=$(grep -o '<section id="[a-z0-9-]*"' "$page" | sed 's/.*id="//; s/"//' | grep -v '^tests' | tr '\n' ' ')
          [ "$ids" = "summary regression coverage timing area power signoff stages " ] || { echo "::error::sections are '$ids'"; exit 1; }
          # The summary holds the numbers a reader asks first. A card whose
          # data the real run has is named, so the section cannot lose it
          # unnoticed.
          # The page is one line, so the section is cut out of it by pattern.
          summary=$(grep -o '<section id="summary">.*' "$page" | sed 's#</section>.*##')
          for card in die "core utilization" instances clock "timing, worst slack" "code coverage" "total power" signoff; do
            if ! grep -qF "<div class=\"label\">$card</div>" <<<"$summary"; then
              echo "::error::The summary has no '$card' card."
              exit 1
            fi
          done
          for gone in Waveform "Block diagram" Schematic "Worst setup path"; do
            if grep -qF "$gone" "$page"; then
              echo "::error::The page still has '$gone'."
              exit 1
            fi
          done
          # Coverage was measured by `make coverage` in the Report step, on the
          # real design. The page must say what summary.json says, and the
          # numbers must be possible: hit within total, the share right, and
          # each kind counted again from coverage.dat itself.
          python3 - "$page" <<'PY'
          import json, re, sys
          page = open(sys.argv[1]).read()
          d = json.load(open("build/coverage/summary.json"))
          types = d["types"]
          for kind, label in (("line", "Block"), ("branch", "Branch"), ("toggle", "Toggle")):
              if kind not in types:
                  sys.exit(f"::error::summary.json has no {kind}")
              t = types[kind]
              if not (0 <= t["hit"] <= t["total"]):
                  sys.exit(f"::error::{kind} hit {t['hit']} of {t['total']}")
              if t["total"] and t["percent"] != round(t["hit"] * 100 / t["total"], 1):
                  sys.exit(f"::error::{kind} percent {t['percent']} is not {t['hit']}/{t['total']}")
              share = "n/a" if t["percent"] is None else f"{t['percent']:.1f}%"
              row = f'<td>{label}</td><td class="num">{t["hit"]:,} / {t["total"]:,}</td><td class="num">{share}</td>'
              if row not in page:
                  sys.exit(f"::error::the page has no row {row}")
          if not types["line"]["total"] or not types["toggle"]["total"]:
              sys.exit("::error::coverage counted no line or toggle point in the design")
          if not d["tests"] or d["tests"]["passed"] != d["tests"]["total"]:
              sys.exit(f"::error::the Verilator run of the tests: {d['tests']}")
          count = {}
          for text in open("build/coverage/coverage.dat"):
              m = re.match(r"C '.*page\x02v_(\w+)/[^\x01]*.*' (\d+)$", text.rstrip("\n"))
              if m:
                  hit, total = count.get(m[1], (0, 0))
                  count[m[1]] = (hit + (int(m[2]) >= 1), total + 1)
          for kind in ("line", "branch", "toggle"):
              if count.get(kind, (0, 0)) != (types[kind]["hit"], types[kind]["total"]):
                  sys.exit(f"::error::coverage.dat holds {count.get(kind)} for {kind}, summary.json {types[kind]}")
          summary = re.search(r'<section id="summary">.*?</section>', page, re.S)[0]
          # Three to a row: what the chip is, its clock and timing, then
          # coverage, power and signoff.
          order = re.findall(r'<div class="label">([^<]*)</div>', summary)
          want = ["die", "core utilization", "instances", "clock", "timing, worst slack", "code coverage", "total power", "signoff"]
          if order != want:
              sys.exit(f"::error::the Summary cards are {order}, expected {want}")
          # Timing is one card with both stats, each coloured by its own sign.
          timing = re.search(r'<div class="kpi timing">.*?</div></div></div></div>', summary, re.S)[0]
          stats = re.findall(r'<div class="stat (good|bad)"><div class="value">([^<]*)</div><div class="detail">(setup|hold) &middot; ([^<]*)</div>', timing)
          if [s[2] for s in stats] != ["setup", "hold"]:
              sys.exit(f"::error::the timing card has stats {stats}")
          for state, value, name, _ in stats:
              if state != ("bad" if value.startswith("-") else "good"):
                  sys.exit(f"::error::the {name} stat is {state} for {value}")
          card = re.search(r'<div class="kpi coverage"><div class="label">code coverage</div><div class="stats">(.*?</div></div>)</div></div>', summary, re.S)
          got = re.findall(r'<div class="stat"><div class="value">([^<]*)</div><div class="detail">([^<]*)</div></div>', card[1])
          expect = []
          for kind, label in (("line", "Block"), ("branch", "Branch"), ("toggle", "Toggle")):
              share = "n/a" if types[kind]["percent"] is None else f"{types[kind]['percent']:.1f}%"
              expect.append((share, label))
          if got != expect or card[1].count('class="stat"') != 3 or "block." in card[0]:
              sys.exit(f"::error::the code coverage card is {got}, expected {expect}")
          print("coverage:", {k: (v["hit"], v["total"]) for k, v in types.items()})
          PY
          # The constraints are read from the real STA step's config.json. A key
          # name that does not match leaves its row out, so each one is named.
          for c in "clock period" "clock uncertainty" "clock transition" "timing derate" "input and output delay"; do
            if ! grep -qF "<td>$c</td>" "$page"; then
              echo "::error::The page has no '$c' row: the run's config.json did not give it."
              exit 1
            fi
          done
          grep -o '<tr><td>clock [a-z]*</td><td>[^<]*</td><td>[^<]*' "$page" | sed 's/<[^>]*>/ /g'
          # Drive strength comes from the routed netlist in final/nl and from
          # synthesis's stat.json. Each routed instance is a logic cell, a well
          # tap or an antenna diode here (fill is not in the page's count), so
          # the table's routed total is the page's routed count less the taps
          # and diodes. A netlist read wrongly breaks that sum.
          python3 - "$page" <<'PY'
          import re, sys
          page = open(sys.argv[1]).read()
          num = lambda text: int(text.replace(",", ""))
          table = re.search(r'<table class="drive">(.*?)</table>', page, re.S)
          if not table:
              sys.exit("::error::The page has no drive strength table.")
          rows = re.findall(r'<tr><td>X(\d+)</td><td class="num">([\d,]+)</td><td class="num">([\d,]+)</td></tr>',
                            table.group(1))
          if not rows:
              sys.exit("::error::The drive strength table has no row with both stages.")
          heading = re.search(r"<h3>Instances: ([\d,]+) after synthesis, ([\d,]+) after routing</h3>", page)
          if not heading:
              sys.exit("::error::The page has no instance count for both stages.")
          synthesized, routed = num(heading[1]), num(heading[2])
          taps = re.search(r"([\d,]+) well taps", page)
          diodes = re.search(r"([\d,]+) antenna cell", page)
          physical = (num(taps[1]) if taps else 0) + (num(diodes[1]) if diodes else 0)
          got = (sum(num(r[1]) for r in rows), sum(num(r[2]) for r in rows))
          want = (synthesized, routed - physical)
          print("drive strength:", ", ".join(f"X{r[0]} {r[1]}->{r[2]}" for r in rows),
                "| totals", got, "| instances less taps and diodes", want)
          if got != want:
              sys.exit(f"::error::Drive strength totals {got} are not the instance counts {want}.")
          if "<code>sky130_fd_sc_hd</code>, single threshold voltage" not in page:
              sys.exit("::error::The page does not name the library from the run's config.json.")
          PY
          # `make gds` drew a picture of each stage into build/stages/, in the
          # same job, and `make site` carried them to the directory that the
          # Pages artifact is made of. A stage drawn for the real design that
          # is not on the page, or a page that names a file it does not have,
          # fails here.
          python3 - "$page" <<'PY'
          import json, os, sys
          page = open(sys.argv[1]).read()
          rows = json.load(open("build/stages/stages.json"))["stages"]
          pngs = [r["png"] for r in rows if r["png"]]
          if len(pngs) < 5:
              sys.exit(f"::error::make gds drew {len(pngs)} stage pictures, expected at least 5: {pngs}")
          for name in pngs:
              # Signoff's picture is the layout image when it is the same file.
              shared = name == "signoff.png" and not os.path.exists("build/site/stages/" + name)
              rel = "layout.png" if shared else "stages/" + name
              if not os.path.getsize("build/site/" + rel) or f'data-src="{rel}"' not in page:
                  sys.exit(f"::error::{rel} is empty or not on the page.")
          if any(r["status"] != "ok" for r in rows):
              sys.exit(f"::error::a stage of the real run did not end ok: {[(r['name'], r['status']) for r in rows]}")
          print("stage pictures:", ", ".join(pngs))
          PY
          # Not asserted: whether the real run wrote ir__drop__worst. The
          # line is printed so the log says what a real run gives.
          grep -o 'Static IR drop[^<]*' "$page" || echo "the page has no IR drop line: the run reported no ir__drop__worst"

      # Its schematic and layout artifact names are fixed; the other job here
      # uploads artifacts-docker-build, so nothing collides.
      - name: Upload
        if: always()
        uses: ./c4o-core/actions/upload
        with:
          name: actions-end-to-end
          retention-days: 1

      # upload-artifact only warns when a path matches nothing, so an upload
      # pointed at the wrong file stays green. The run is asked instead.
      - name: The run holds the three artifacts upload names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name')
          echo "$names"
          for want in schematic layout actions-end-to-end; do
            if ! grep -qxF "$want" <<<"$names"; then
              echo "::error::This run has no artifact named $want."
              exit 1
            fi
          done
