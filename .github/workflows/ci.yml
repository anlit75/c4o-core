name: c4o-core CI

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t c4o-core:test .

      # Explicit Files Tests
      - name: Run Lint check (CLI)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test lint --files tests/smoke/counter.v

      - name: Run Synthesis check (CLI)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test synth --files tests/smoke/counter.v
          ls -l build/synthesis.json

      - name: Run Simulation check (CLI)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test sim --files tests/smoke/tb_counter.v tests/smoke/counter.v

      # Config Based Tests
      - name: Create Config for Synthesis
        run: |
          echo '{"DESIGN_NAME": "counter", "VERILOG_FILES": ["tests/smoke/counter.v"], "PDK": "sky130A", "STD_CELL_LIBRARY": "sky130_fd_sc_hd", "DIE_AREA": "0 0 100 100", "FP_CORE_UTIL": 40, "FP_SIZING": "absolute", "CLOCK_PORT": "clk", "CLOCK_PERIOD": 10.0}' > config.json

      - name: Run Lint check (Config)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test lint

      - name: Run Synthesis check (Config)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test synth
          ls -l build/synthesis.json

      - name: Run GDS check (Config)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test gds

      - name: Verify PDK Command Interface
        run: |
          docker run --rm c4o-core:test pdk --help

      - name: Update Config for Simulation
        run: |
          echo '{"DESIGN_NAME": "counter", "VERILOG_FILES": ["tests/smoke/tb_counter.v", "tests/smoke/counter.v"], "PDK": "sky130A", "STD_CELL_LIBRARY": "sky130_fd_sc_hd", "DIE_AREA": "0 0 100 100", "FP_CORE_UTIL": 40, "FP_SIZING": "absolute", "CLOCK_PORT": "clk", "CLOCK_PERIOD": 10.0}' > config.json

      - name: Run Simulation check (Config)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace c4o-core:test sim

      - name: Upload Docker Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-docker-build
          path: build/

  test-action-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Synthesis via Action
        uses: ./
        with:
          command: synth
          files: tests/smoke/counter.v

      - name: Verify Synthesis Artifact
        run: ls -l build/synthesis.json

      - name: Run Smoke Test via Action
        uses: ./
        with:
          command: sim
          files: tests/smoke/tb_counter.v tests/smoke/counter.v

      - name: Upload Action Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-action-test
          path: build/
