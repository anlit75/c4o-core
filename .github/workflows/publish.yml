name: Release and Publish Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Four tags, and the two new ones are the point.
      #
      # ChipForAll and c4o-pyuvm each pin this image in three places, so every
      # release used to mean two pull requests editing six lines by hand, for a
      # patch that changed nothing about the interface. Publishing X.Y as well
      # lets them pin the minor: a fix ships to both of them with no pull
      # request at all, and only a minor or major bump is anyone's work.
      #
      # 'latest' stays for one-off `docker run` -- nothing pins it.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # Asserted rather than assumed: the tag list above is a declaration to an
      # action, and the thing downstream repositories depend on is what it
      # actually produced. A pattern that silently stopped expanding would
      # leave their pins resolving to an image that never gets rebuilt, which
      # nothing else here would notice.
      - name: The tag list carries the pins downstream repositories use
        run: |
          version="${GITHUB_REF_NAME#v}"
          # metadata-action drops {{major}} and {{major}}.{{minor}} for
          # pre-releases on purpose, so only a plain vX.Y.Z is asserted here.
          case "$version" in
            *[!0-9.]*) echo "$GITHUB_REF_NAME is not a plain vX.Y.Z tag; nothing to assert."; exit 0 ;;
            *.*.*) ;;
            *) echo "$GITHUB_REF_NAME is not a plain vX.Y.Z tag; nothing to assert."; exit 0 ;;
          esac

          # metadata-action lowercases the image name; GITHUB_REPOSITORY does not.
          image=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          tags='${{ steps.meta.outputs.tags }}'
          echo "$tags"
          for want in "$version" "${version%.*}" "${version%%.*}" latest; do
            echo "$tags" | grep -qxF "${image}:${want}" \
              || { echo "missing tag: ${image}:${want}"; exit 1; }
          done

      # provenance and sbom stay off: BuildKit would attach its own attestations
      # and turn every tag into an index instead of the plain manifest it is
      # today. The signed ones are made below, against the pushed digest.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      # Signed provenance and an SBOM for the image just pushed, so a user can
      # check with `gh attestation verify` that it came from this repository.
      #
      # Before the branch moves: if an attestation fails, the branch and the
      # release stay where they were, rather than publishing a release whose
      # image cannot be verified.
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      # actions/ is called from other repositories, and they name a ref that
      # moves: the branch vMAJOR, so that a fix reaches them with no pull
      # request, the way the X.Y image tag does. A branch and not a tag: the
      # release-tag ruleset forbids deleting or rewriting anything under
      # refs/tags/v*, so a tag that has to move would be the one thing here
      # that could never be corrected.
      #
      # After the image is pushed, so the branch never points at a release
      # whose image is not there. Fast-forward only: a branch that has left
      # the release line is refused rather than overwritten.
      - name: Move the major branch to this release
        run: bash scripts/move-major-branch.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false