name: c4o-core report
description: >
  After `make gds`: the gate-level simulation, the signoff numbers on the run's
  summary, and the results page. The simulation is the Verilog testbench of
  //GATE_TESTS (not on pull requests), else the cocotb tests of //COCOTB_TESTS
  (on every event, with a check that the gates ran the tests the RTL ran).
  Neither key means no gate-level simulation. On a push to main it also asks whether GitHub Pages is set
  to publish from Actions and, if so, uploads the page for a deploy job.
inputs:
  sections:
    description: >
      Extra <h2> sections the results page must have, one per line, beyond the
      two the flow always gives (Power, Signoff checks).
    required: false
    default: ''
  gatesim-minutes:
    description: The gate-level simulation is stopped after this many minutes.
    required: false
    default: '15'
outputs:
  publish-pages:
    description: "'true' when the results page was uploaded for a Pages deploy."
    value: ${{ steps.pages.outputs.publish }}
runs:
  using: composite
  steps:
    # Not on pull requests: a gate-level testbench cannot shrink the design
    # through a parameter, so this can take minutes. Phrased as "not a pull
    # request" so that workflow_dispatch runs it too.
    - name: Gate-level simulation (Verilog testbench)
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        MINUTES: ${{ inputs.gatesim-minutes }}
      run: |
        if ! grep -q '^"//GATE_TESTS":' config.yaml; then
          echo "config.yaml has no //GATE_TESTS -- no gate-level testbench to run."
          exit 0
        fi
        timeout "${MINUTES}m" make gatesim

    # The same Python tests as the RTL run, on the gates. No `if:` on the event:
    # the tests are the ones that already run on a pull request, and the point
    # of running them again is to catch a change that breaks only the gates.
    # `make gatesim` runs these same tests when //GATE_TESTS is absent, so this
    # step runs exactly when the one above does not.
    - name: Gate-level simulation (cocotb tests)
      shell: bash
      env:
        MINUTES: ${{ inputs.gatesim-minutes }}
      run: |
        if grep -q '^"//GATE_TESTS":' config.yaml; then
          echo "config.yaml has //GATE_TESTS -- the Verilog testbench is the gate-level run."
          exit 0
        fi
        if ! grep -q '^"//COCOTB_TESTS":' config.yaml; then
          echo "config.yaml has neither //GATE_TESTS nor //COCOTB_TESTS -- no gate-level simulation to run."
          exit 0
        fi
        mkdir -p build
        set -o pipefail
        # Not `make gatesim`: before 2.18 that target wants //GATE_TESTS. C4O_COCOTB
        # is public in every 2.x, so this works with any 2.x image.
        timeout "${MINUTES}m" make --eval '__c4o_cocotb_gates: ; $(C4O_COCOTB) cocotb --netlist' __c4o_cocotb_gates 2>&1 | tee build/cocotb-gl.log
        bash "$GITHUB_ACTION_PATH/cocotb-gates.sh"

    # The [INFO] lines are c4o-core saying which files it read, not results,
    # so they stay in the log.
    - name: Signoff numbers on the summary page
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/signoff-summary.sh"

    - name: Build the results page
      shell: bash
      env:
        EXTRA_SECTIONS: ${{ inputs.sections }}
      run: bash "$GITHUB_ACTION_PATH/results-page.sh"

    # Only main is published, and only when the repository has Pages set to
    # "GitHub Actions". A copy of the template starts with Pages off, and
    # turning it on is a setting no workflow token can change -- so off is a
    # notice, not a red run. An answer that is neither yes nor no fails.
    - name: Is GitHub Pages set to publish from Actions?
      id: pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/pages-setting.sh"

    - name: Upload the results page
      if: steps.pages.outputs.publish == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: build/site
