name: c4o-core checks
description: >
  The checks of a push: lint, the Verilog testbenches and the Python
  (cocotb) testbenches when config.yaml asks for them, synthesis, and the
  schematic. Fails when config.yaml asks for neither kind of test. The cocotb
  output is kept in build/cocotb-rtl.log. With "//REGRESSION" it also runs the
  test list over its seeds, and keeps the output in build/regress.log.
runs:
  using: composite
  steps:
    - name: Lint
      shell: bash
      run: make lint

    - name: Some test is configured
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/tests-configured.sh"

    # Skipped when config.yaml names no Verilog testbench, the way the cocotb
    # step is. With the key there and no file matching it, `make sim` fails.
    - name: Simulation
      shell: bash
      run: |
        if ! grep -q '^"//TEST_FILES":' config.yaml; then
          echo "config.yaml has no //TEST_FILES -- no Verilog testbenches to run."
          exit 0
        fi
        make sim

    # Skipped when config.yaml does not ask for Python testbenches: the key's
    # presence is the opt-in. If it is there and matches no files, `make
    # cocotb` fails, which is correct.
    - name: cocotb tests
      shell: bash
      run: |
        if ! grep -q '^"//COCOTB_TESTS":' config.yaml; then
          echo "config.yaml has no //COCOTB_TESTS -- no Python testbenches to run."
          exit 0
        fi
        mkdir -p build
        set -o pipefail
        make cocotb 2>&1 | tee build/cocotb-rtl.log

    # always() so a failing test is shown too: that is when the table is worth
    # opening. Gated on the file, so a run that crashed before writing it has
    # nothing to show.
    - name: cocotb results on the summary page
      if: always() && hashFiles('build/cocotb-results.xml') != ''
      uses: test-summary/action@v2
      with:
        paths: build/cocotb-results.xml

    # Skipped when config.yaml names no test list, the way the cocotb step is.
    # With the key there, `make regress` fails on a bad list or a failed run.
    - name: Regression
      shell: bash
      run: |
        if ! grep -q '^"//REGRESSION":' config.yaml; then
          echo "config.yaml has no //REGRESSION -- no test list to run."
          exit 0
        fi
        mkdir -p build
        set -o pipefail
        make regress 2>&1 | tee build/regress.log

    # always() for the same reason: a failed run is when the table matters.
    - name: Regression results on the summary page
      if: always() && hashFiles('build/regress/summary.json') != ''
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/regress-summary.sh"

    - name: Logic synthesis
      shell: bash
      run: make synth

    - name: Schematic
      shell: bash
      run: |
        make schematic
        ls -lh build/schematic.svg
        grep -qF "<svg" build/schematic.svg || { echo "::error::build/schematic.svg is not an SVG."; exit 1; }
